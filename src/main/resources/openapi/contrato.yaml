"POST /api/v1/ventas/productos":
  resumen: Vender productos
  cus: CUS26
  solicitud: { idCliente: 407, lineas: [ { idProducto: 40, cantidad: 2, idPersonal: 4 } ], idMedioPago: 1, monto: 90.00, tipo: BOLETA }
  respuestas:
    "201":
      descripcion: "Venta CERRADA con su boleta o factura; Oracle registra la salida de kardex al cerrar (TRG_VENTA_EFECTOS)"
      ejemplo: { idVenta: 620, idSede: 1, idCaja: 12, idCliente: 407, estado: CERRADA, detalles: [ { idDetalle: 900, tipoItem: PRODUCTO, cantidad: 2, precioUnitario: 45.00, descuento: 0.00, subtotal: 90.00, idPersonal: 4, idProducto: 40 } ], subtotal: 90.00, igv: 0.00, descuento: 0.00, adelantoAplicado: 0.00, saldoFavorAplicado: 0.00, total: 90.00, pagos: [ { idMedioPago: 1, monto: 90.00 } ], pagado: 90.00, pendiente: 0.00, cobrosPendientes: [ ], comprobante: { idComprobante: 700, tipo: BOLETA, serie: B001, numero: "00000125", estadoSunat: PENDIENTE } }
    "202":
      descripcion: "El cobro digital quedó PENDIENTE: la venta queda ABIERTA y se cierra con POST /ventas/{idVenta}/cierre cuando la pasarela lo aprueba (RN52)"
      ejemplo: { idVenta: 621, idSede: 1, idCaja: 12, estado: ABIERTA, total: 45.00, pagos: [ ], pagado: 0.00, pendiente: 45.00, cobrosPendientes: [ { idTransaccion: 77, idMedioPago: 3, monto: 45.00, canal: QR, estado: PENDIENTE, enlacePago: "https://pasarela.example/qr/77", fechaExpiracion: "2026-11-17T10:00:00" } ] }
    "400": { descripcion: Faltan las líneas, el medio de pago, el monto o el tipo de comprobante, regla: VALIDACION }
    "409": { descripcion: No hay stock suficiente en la sede, regla: RN15 }
    "422": { descripcion: "Sin caja abierta (RN30), el monto no es el total (RN11), un insumo no se vende (RN13) o la pasarela rechazó el cobro (RF103)", regla: RN11 }

