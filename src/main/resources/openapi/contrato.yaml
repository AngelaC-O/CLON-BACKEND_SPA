      ejemplo: { idSolicitud: 15, idVenta: 620, motivo: "La clienta desistió", codigoMotivo: "06", formaDevolucion: SALDO_FAVOR, estado: APROBADA, idUsuarioSolicita: 2, fechaSolicitud: "2026-11-09T11:00:00", idUsuarioResuelve: 1, fechaResolucion: "2026-11-09T11:30:00", idNotaCredito: 701, idCliente: 407, totalVenta: 90.00, comprobante: "B001-00000125" }
