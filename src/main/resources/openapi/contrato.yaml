"GET /api/v1/series-comprobante":
  resumen: Listar las series de comprobante de la sede
  cus: CUS63
  respuestas:
    "200":
      descripcion: Series de la sede (sin idSede, la de la sesión) con su último número, que lleva Oracle (RN47)
      ejemplo: [ { idSerie: 1, idSede: 1, tipo: BOLETA, serie: B001, ultimoNumero: 125, estado: ACTIVA } ]

"POST /api/v1/series-comprobante":
  resumen: Registrar una serie de comprobante
  cus: CUS63
  solicitud: { idSede: 2, tipo: BOLETA, serie: B002 }
  respuestas:
    "201":
      descripcion: Serie ACTIVA con el correlativo en 0
      ejemplo: { idSerie: 9, idSede: 2, tipo: BOLETA, serie: B002, ultimoNumero: 0, estado: ACTIVA }
    "400": { descripcion: Falta el tipo de comprobante, regla: VALIDACION }
    "409": { descripcion: "La sede ya tiene una serie ACTIVA de ese tipo o la serie ya existe", regla: UQ_SERIE_COMPR_ACTIVA }
    "422": { descripcion: La serie tiene 4 caracteres y empieza con B o F según el tipo, regla: RF107 }

"GET /api/v1/parametros":
  resumen: Listar los parámetros del negocio
  cus: CUS65
  respuestas:
    "200":
      descripcion: Parámetros con su valor, su vigencia y quién los cambió
      ejemplo: [ { idParametro: 9, codigo: AGENDA_PASO_MIN, descripcion: "Minutos entre horas libres de la agenda (RN51)", valorNumero: 15, fechaVigencia: "2026-11-08", idUsuario: 1 } ]

"PATCH /api/v1/parametros/{codigo}":
  resumen: Cambiar el valor de un parámetro
  cus: CUS65
  solicitud: { valorNumero: 10, fechaVigencia: "2026-11-10" }
  respuestas:
    "200":
      descripcion: Valor cambiado; TRG_AUD_PARAMETRO lo audita (RN29)
      ejemplo: { idParametro: 9, codigo: AGENDA_PASO_MIN, descripcion: "Minutos entre horas libres de la agenda (RN51)", valorNumero: 10, fechaVigencia: "2026-11-10", idUsuario: 1 }
    "404": { descripcion: El parámetro no existe (los códigos no se crean), regla: RF87 }
    "422": { descripcion: "Falta el valor (CK_PARAMETRO_VALOR) o AGENDA_PASO_MIN no es un entero mayor que 0 (RN51)", regla: RN51 }

"GET /api/v1/tipos-documento":
  resumen: Listar los tipos de documento
  cus: CUS65
  respuestas:
    "200":
      descripcion: "Catálogo 06 de SUNAT con su longitud y formato; reemplaza los id fijos del front-end"
      ejemplo: [ { idTipoDocumento: 1, codigoSunat: "1", nombre: "Documento Nacional de Identidad", abreviatura: DNI, longitudMin: 8, longitudMax: 8, soloNumeros: true, consultaApi: true, estado: ACTIVO } ]

"PATCH /api/v1/tipos-documento/{idTipoDocumento}":
  resumen: Configurar un tipo de documento
  cus: CUS65
  solicitud: { consultaApi: false, estado: INACTIVO }
  respuestas:
    "200":
      descripcion: Tipo de documento activado o desactivado y marcado para consultar en APISPERU
      ejemplo: { idTipoDocumento: 4, codigoSunat: "7", nombre: "Pasaporte", abreviatura: PAS, longitudMin: 6, longitudMax: 12, soloNumeros: false, consultaApi: false, estado: INACTIVO }
    "404": { descripcion: El tipo de documento no existe, regla: RN45 }
    "422": { descripcion: Solo el DNI y el RUC se consultan en APISPERU, regla: RN45 }

"GET /api/v1/reportes/{tipoReporte}":
  resumen: Generar un reporte gerencial
  cus: CUS48
  respuestas:
    "200":
      descripcion: "ventas (RF68), productos (RF69), margen (RF70), demanda (RF71), ocupacion (RF72) o especialistas (RF73), sin ventas anuladas (RN33); sin idSede, el consolidado (RF93)"
      ejemplo: { tipoReporte: ventas, titulo: Ventas, agrupacion: LINEA, fechaInicio: "2026-11-01", fechaFin: "2026-11-30", columnas: [ { campo: grupo, titulo: Grupo }, { campo: cantidad, titulo: "Ventas o unidades" }, { campo: importe, titulo: "Importe S/" } ], filas: [ { grupo: SALON, cantidad: 42, importe: 1470.00 }, { grupo: SPA, cantidad: 18, importe: 1260.00 } ] }
    "403": { descripcion: "Costos y márgenes (productos y margen) sin ser la Administradora", regla: RN24 }
    "404": { descripcion: El tipo de reporte no existe, regla: RF68 }
    "422": { descripcion: "Faltan las fechas, el inicio es posterior al fin, el rango pasa de 366 días o la agrupación no es de ese reporte", regla: RF68 }

"GET /api/v1/reportes/{tipoReporte}/exportacion":
  resumen: Exportar un reporte gerencial
  cus: CUS49
  respuestas:
    "200":
      descripcion: "Descarga de reporte_<tipo>_<desde>_<hasta>.pdf (formato=PDF) o .xlsx (formato=EXCEL), con Content-Disposition: attachment"
      tipos: [ application/pdf, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet ]
    "403": { descripcion: "Costos y márgenes (productos y margen) sin ser la Administradora", regla: RN24 }
    "404": { descripcion: El tipo de reporte no existe, regla: RF68 }
    "422": { descripcion: "El formato no es EXCEL ni PDF (RF74), o las fechas o la agrupación no son válidas (RF68)", regla: RF74 }
