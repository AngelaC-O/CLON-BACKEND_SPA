# Producción (ambiente produccion de ADR-17). Todo dato sensible llega por variables de entorno del servidor, nunca por .env.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO

server:
  servlet:
    session:
      cookie:
        secure: true

# Puertos de APIs externas (ADR-09): adaptadores reales. Sin alguna de estas variables, la aplicación no arranca
cautiva:
  integraciones:
    apisperu:
      modo: real
      consulta-url: ${APISPERU_CONSULTA_URL}
      token: ${APISPERU_TOKEN}
      facturacion-url: ${APISPERU_FACTURACION_URL}
      facturacion-token: ${APISPERU_FACTURACION_TOKEN}
    izipay:
      modo: real
      api-url: ${IZIPAY_API_URL}
      usuario: ${IZIPAY_USUARIO}
      clave: ${IZIPAY_CLAVE}
      hmac-clave: ${IZIPAY_HMAC_CLAVE}
