# Perfil de las pruebas de integración: sin .env. La conexión la entrega OracleTestcontainer.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

cautiva:
  integraciones:
    apisperu:
      modo: falso
    izipay:
      modo: falso
      respuesta-falsa: APROBADA
      hmac-clave: clave-hmac-solo-de-pruebas
  archivos:
    directorio: ${java.io.tmpdir}/cautiva-pruebas
